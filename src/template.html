<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' blob:; style-src 'unsafe-inline'; img-src data: blob:; worker-src blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>代码航站 · 离线编程练习</title>
<style>
  :root{
    --font-size:16px;
    --bg:#f5f6f8; --panel:#ffffff; --ink:#1f2329; --dim:#6b7280; --line:#e3e6ea;
    --brand:#2563eb; --ok:#15803d; --ok-bg:#e8f6ec; --bad:#c2410c; --bad-bg:#fdeee6;
    --mark:#b45309; --warn-bg:#fff8e1; --warn-line:#f0d48a;
    /* 发丝线：页脚分隔线、自测区外框用它。用户 2026-10-15 反馈亮色下 --line 太浅，
       那条虚线看不出有没有；深色下 --line 已经够显眼，所以暗色主题另给一个。 */
    --hair:#9aa3af;
    --due:#7c3aed; --due-bg:#f1ebfd; --flash:#fde68a;
    --exam-done-bg:#285978;--exam-done-ink:#fffdf5;--exam-done-line:#173f59;
    --exam-part-bg:#f6d784;--exam-part-ink:#503c0c;--exam-part-line:#92700d;
  }
  html[data-theme="dark"]{
    --bg:#101317; --panel:#1c2129; --ink:#e8eaee; --dim:#98a2b3; --line:#2f3742;
    --hair:#4b5563;
    --brand:#60a5fa; --ok:#4ade80; --ok-bg:#14301f; --bad:#fb923c; --bad-bg:#3a2113;
    --mark:#fbbf24; --warn-bg:#3a3016; --warn-line:#6b5a20;
    --due:#c4b5fd; --due-bg:#251f3d; --flash:#5b4a12;
    --exam-done-bg:#9ec9e2;--exam-done-ink:#102b3f;--exam-done-line:#c5e4f4;
    --exam-part-bg:#dbc276;--exam-part-ink:#312505;--exam-part-line:#f2dea7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-size:var(--font-size);line-height:1.6;
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;}
  code,pre,.mono{font-family:Consolas,"Cascadia Mono","Courier New",monospace;font-size:.94em}
  a{color:var(--brand)}
  button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:.46em .9em;min-height:40px;line-height:1.4;cursor:pointer;
    transition:background .12s,border-color .12s,color .12s,box-shadow .12s}
  button:hover{border-color:var(--brand);color:var(--brand);background:var(--bg)}
  button.primary:hover{background:var(--brand)}
  /* 焦点框只在键盘操作时出现，鼠标点完不再留一圈蓝边 */
  button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  button:focus:not(:focus-visible){outline:none}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  button.primary:hover{opacity:.9;color:#fff}
  button:disabled{opacity:.45;cursor:not-allowed}
  button:disabled:hover{border-color:var(--line);color:inherit}
  button.seg{background:var(--bg);border-radius:10px}
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
  .pick-modes{margin-top:16px}
  .pick-types{margin-top:16px}
  .fix-bar{align-items:baseline}
  .fix-bar .grow{align-self:center;text-align:center;white-space:nowrap}
  .footbar{align-items:baseline}
  .fix-stat{white-space:nowrap}
  /* 卡片里「直接挂上去」的竖排按钮（复习池、成绩页）：原来紧贴在一起。
     ⚠ 必须用直接子选择器：写成 `.card button + button` 会连 .toolbar / .footbar /
     .fix-bar 里的横向按钮一起命中，第二个按钮被 margin-top:8px 顶下去 8px，
     同一排里就参差不齐了（用户 2026-10-14 报的「横向的按钮没法对齐」）。 */
  .card > button + button{margin-top:12px}
  .card > .stack > button + button{margin-top:14px}
  .stack{display:flex;flex-direction:column;gap:14px;margin-top:14px}
  /* 右栏窄，竖排按钮拉满整宽看着像一条长条；改成「按内容宽度、左对齐」 */
  .stack button{margin-top:0;text-align:center;min-width:11em}
  button.idle{opacity:.5}
  button.seg.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  html[data-theme="dark"] button.primary,html[data-theme="dark"] button.seg.on,
  html[data-theme="dark"] button.cont.on{color:#101317}
  input[type=number],input[type=text]{font:inherit;color:inherit;background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:.3em .5em;width:6em}
  .wrap{max-width:1180px;margin:0 auto;padding:14px}
  h2{font-size:1.15em;margin:.2em 0 .6em}
  h3{font-size:1em;margin:1.2em 0 .4em}

  header.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
  header.top h1{font-size:1.05em;margin:0 10px 0 0;font-weight:700;white-space:nowrap}
  @media (max-width:700px){
    header.top{display:grid;grid-template-columns:1fr auto;gap:10px}
    header.top h1{margin:0}
    header.top .spacer{display:none}
    header.top #nav{grid-column:1 / -1;grid-row:2;display:flex;flex-wrap:wrap;gap:8px}
    header.top #nav button{flex:1 0 auto;font-size:.88em;padding:.45em .55em}
    header.top .header-tools{grid-column:2;grid-row:1;flex-wrap:nowrap;gap:8px}
  }
  /* 顶栏模式切换（选卷/继续练习/复习/统计）是普通按钮，要留缝；
     唯独段控（.seg）要拼接成一块 —— 用户 2026-10-14 反馈「横向缝太大」就是段控那两排。 */
  .spacer{flex:1}
  .nbadge{display:inline-block;min-width:1.4em;padding:0 .35em;margin-left:.35em;
    background:var(--due);color:#fff;border-radius:99px;font-size:.8em;text-align:center}
  html[data-theme="dark"] .nbadge{color:#1a1526}

  /* 右栏固定 288px：答题卡是 auto-fill 网格，宽度一变列数就跳，整页会看着错位。 */
  .grid{display:grid;grid-template-columns:minmax(0,1fr) 288px;gap:16px;margin-top:14px}
  @media (max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
  .grid > *{min-width:0}
  .table-scroll{max-width:100%;overflow-x:auto;overscroll-behavior-x:contain}
  .table-scroll table{min-width:460px}
  .table-scroll th{white-space:nowrap}
  .table-scroll td{vertical-align:top}
  .table-scroll:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:6px}
  .table-scroll button,.toolbar button,.footbar button,header.top button{white-space:nowrap}
  .table-scroll td > button + button{margin-left:8px}
  .result-grid{grid-template-columns:minmax(0,1fr)}
  .result-grid > .card + .card{margin-top:0}
  .result-card .stat{display:grid;grid-template-columns:1.6fr 1.1fr repeat(4,1fr);gap:16px;
    margin:16px 0 24px}
  .result-card .stat > div{min-width:0}
  .result-card .big{font-size:clamp(1.3rem,2.3vw,1.9rem);white-space:nowrap;font-variant-numeric:tabular-nums}
  .table-scroll .result-table{min-width:760px}
  .result-table td:first-child,.result-table td:nth-child(2),.result-table td:nth-child(5){white-space:nowrap}
  .result-table td:nth-child(3),.result-table td:nth-child(4){overflow-wrap:anywhere}
  .result-table .tag{margin-left:0;white-space:nowrap}
  .result-jump > summary{color:var(--ink);font-weight:600}
  .result-jump .sheet{margin-top:14px;grid-template-columns:repeat(auto-fill,minmax(40px,1fr))}
  @media (max-width:700px){
    .result-card .stat{grid-template-columns:repeat(auto-fit,minmax(min(100%,9em),1fr));gap:16px 12px}
    .result-card .big{font-size:1.5rem}
    .table-scroll .result-table{min-width:0}
    .result-table thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
    .result-table tbody{display:grid;gap:12px}
    .result-table tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;
      padding:12px;border:1px solid var(--line);border-radius:10px}
    .result-table td{display:block;min-width:0;border:0;padding:0}
    .result-table td::before{content:attr(data-label);display:block;color:var(--dim);font-size:.8em}
    .result-table td:first-child{grid-column:1 / -1;font-weight:600;white-space:normal}
    .result-table td:first-child::before,.result-table td:last-child::before{display:none}
    .result-table td:nth-child(3),.result-table td:nth-child(4){grid-column:1 / -1;white-space:normal}
    .result-table td:nth-child(6){grid-column:2;grid-row:2}
    .result-table td:last-child{grid-column:2;align-self:end;justify-self:end}
  }
  .fix-wrap:focus-within{outline:2px solid var(--brand);outline-offset:2px}
  .fix-ta{min-width:0}
  .card + .card{margin-top:14px}
  .meta{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;color:var(--dim);
    font-size:.92em;margin-bottom:10px}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;
    flex:1 1 140px;min-width:100px}
  .bar > i{display:block;height:100%;background:var(--brand);width:0;transition:width .2s}

  .stem{font-size:1.06em;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;
    margin:2px 0 14px}
  .stem.code{font-family:Consolas,"Cascadia Mono","Courier New",monospace;font-size:.98em}
  .stem .num{font-weight:700}

  .figs{margin:0 0 14px}
  .figs .fig{margin:0 0 10px;max-width:100%}
  .figs img{display:block;max-width:100%;height:auto;background:#fff;
    border:1px solid var(--line);border-radius:8px;padding:6px;cursor:zoom-in}
  .figs .cap{color:var(--dim);font-size:.84em;margin-top:3px}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:99;
    display:flex;align-items:center;justify-content:center;padding:3vh 3vw;cursor:zoom-out}
  .modal img{max-width:100%;max-height:94vh;background:#fff;border-radius:8px;padding:8px}
  .path{font-family:Consolas,monospace;background:var(--bg);border:1px solid var(--line);
    border-radius:6px;padding:2px 6px;user-select:all;word-break:break-all}

  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);
    border-radius:8px;padding:9px 11px;cursor:pointer;background:var(--panel);
    transition:border-color .12s,background .12s}
  .opt:hover{border-color:var(--brand)}
  .opt .lt{font-weight:700;min-width:1.6em;flex:none}
  .opt .tx{white-space:pre-wrap;word-break:break-word;flex:1}
  .opt .kb{color:var(--dim);font-size:.82em;flex:none;border:1px solid var(--line);
    border-radius:5px;padding:0 .35em}
  .opt .mk{flex:none;font-weight:700}
  .opt.right{background:var(--ok-bg);border-color:var(--ok)}
  .opt.right .mk{color:var(--ok)}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
  .opt.wrong .mk{color:var(--bad)}
  .opt.chosen{border-width:2px}
  button.opt{text-align:left;width:100%;font-weight:400}
  .opt.exam-picked{border:2px solid var(--brand);background:var(--bg)}
  button.cell{padding:0;min-height:36px}
  .exam-clock{font-weight:700;font-variant-numeric:tabular-nums;color:var(--brand);font-size:1.1em}
  .exam-clock.urgent{color:var(--bad)}
  .exam-setup{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:16px 0}
  .exam-setup label{display:flex;align-items:center;gap:8px}
  .exam-feedback pre{white-space:pre-wrap;overflow-wrap:anywhere}
  .fix-ta.exam-code{height:28rem;min-height:20rem}
  .opt.locked{cursor:default}
  .opt.flash{animation:flashbg 1.1s ease-in-out infinite alternate}
  @keyframes flashbg{from{background:var(--ok-bg)}to{background:var(--flash)}}
  @media (prefers-reduced-motion:reduce){.opt.flash{animation:none;background:var(--flash)}}

  .warn{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:8px;
    padding:8px 10px;margin-bottom:12px;font-size:.94em;display:flex;gap:10px;
    align-items:center;flex-wrap:wrap}
  .info{background:var(--due-bg);border:1px solid var(--due);border-radius:8px;
    padding:8px 10px;margin-bottom:12px;font-size:.94em;display:flex;gap:10px;
    align-items:center;flex-wrap:wrap}
  /* 页脚按钮换行时两排别贴在一起（用户 2026-10-15：「上下按钮间隔还是那么近」）：
     行间距 14px、列间距保持 8px；分隔线换成可见的发丝线。 */
  .footbar{display:flex;gap:14px 12px;flex-wrap:wrap;margin-top:16px;padding-top:14px;
    border-top:1px dashed var(--hair);align-items:center}

  /* 答题卡：21 格挤在 288px 栏里，38px 会撑到换行/溢出，收到 34px；
     当前题不再只靠 outline，改成加粗边框更醒目（outline 在深色下偏弱）。 */
  .sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px}
  .cell{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);border-radius:7px;background:var(--panel);cursor:pointer;
    font-size:.9em;position:relative;user-select:none}
  .cell:hover{border-color:var(--brand)}
  .cell.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
  .cell.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .cell.part{background:var(--warn-bg);border-color:var(--warn-line);color:var(--mark)}
  .cell.cur{outline:2px solid var(--brand);outline-offset:1px;border-width:2px;font-weight:700}
  .cell.mastered::after{content:"";position:absolute;left:3px;top:3px;width:6px;height:6px;
    border-radius:50%;background:var(--ok);opacity:.75}
  .cell .star{position:absolute;top:-5px;right:-1px;font-size:.7em;color:var(--mark)}
  /* 考试只表达作答状态，独立于主题色以及交卷后的对错配色。 */
  .sheet.exam-sheet .cell.answered{background:var(--exam-done-bg);color:var(--exam-done-ink);border:2px solid var(--exam-done-line);font-weight:700}
  .sheet.exam-sheet .cell.part{background:var(--exam-part-bg);color:var(--exam-part-ink);border:2px dashed var(--exam-part-line)}
  .sheet.exam-sheet .cell.cur{outline:3px solid var(--ink);outline-offset:2px}
  .sheet.exam-sheet .cell.answered .star{color:var(--exam-done-ink)}
  .exam-sheet-legend{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:12px;font-size:.82em;color:var(--ink)}
  .exam-legend-item{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .exam-legend-swatch{display:inline-block;width:15px;height:15px;flex:none;border:1px solid var(--line);border-radius:2px;background:var(--ns-paper,var(--panel))}
  .exam-legend-swatch.exam-legend-answered{background:var(--exam-done-bg);border:2px solid var(--exam-done-line)}
  .exam-legend-swatch.exam-legend-partial{background:var(--exam-part-bg);border:2px dashed var(--exam-part-line)}
  .exam-legend-swatch.exam-legend-current{border:2px solid var(--ink)}
  .tip{color:var(--dim);font-size:.86em;margin-top:10px;display:flex;gap:12px;flex-wrap:wrap}
  .note{color:var(--dim);font-size:.82em;margin-top:10px}
  .kbd{color:var(--dim);font-size:.86em;margin-top:10px;line-height:1.9}
  .kbd b{font-weight:600;color:var(--ink)}

  table{width:100%;border-collapse:collapse;font-size:.95em}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:600;font-size:.9em}
  tr.clickable{cursor:pointer}
  tr.clickable:hover{background:var(--bg)}
  .big{font-size:1.9em;font-weight:700;line-height:1.2}
  .stat{display:flex;gap:26px;flex-wrap:wrap;margin:6px 0 14px}
  .stat div span{display:block;color:var(--dim);font-size:.86em}
  .empty{color:var(--dim);padding:18px;background:var(--bg);border:1px dashed var(--line);
    border-radius:10px;margin:14px 0;line-height:1.8}
  select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;padding:.3em .5em}
  footer.foot{color:var(--dim);font-size:.85em;margin:16px 2px 26px}
  hr.sep{border:none;border-top:1px dashed var(--line);margin:12px 0}
  .tag{display:inline-block;font-size:.8em;color:var(--dim);border:1px solid var(--line);
    border-radius:5px;padding:0 .4em;margin-left:.4em}
  .tag.due{color:var(--due);border-color:var(--due)}
  .tag.mastered{color:var(--ok);border-color:var(--ok)}
  details{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:10px}
  summary{cursor:pointer;color:var(--dim)}

  /* ---- 顶栏「继续练习」：只在做题界面变蓝；不在做题界面但有未做完的卷 → 小红点 ---- */
  button.cont.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  button.cont.on:hover{opacity:.9;color:#fff}
  button.cont.dot{position:relative}
  button.cont.dot::after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;
    border-radius:50%;background:#e11d48;box-shadow:0 0 0 2px var(--panel)}
  html[data-theme="dark"] button.cont.dot::after{background:#fb7185}

  /* ---- 问号帮助按钮 ---- */
  button.icon{width:2.1em;padding:.3em 0;text-align:center;font-weight:700}

  /* ---- 设置 / 帮助 里的分板块 ---- */
  .sec{margin:0 0 4px}
  .sec h4{margin:16px 0 6px;font-size:.95em;color:var(--brand);
    border-bottom:1px solid var(--line);padding-bottom:4px}
  .sec h4:first-child{margin-top:4px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:9px 0}
  .row .lbl{flex:1 1 12em;min-width:9em;font-size:.95em}
  .row .hint{color:var(--dim);font-size:.85em;flex-basis:100%;margin-top:-2px}
  .row .ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .numval{display:inline-block;min-width:2.2em;text-align:center;font-weight:700}
  .dbig{font-size:1.5em;font-weight:700;color:var(--danger, #b91c1c)}
  html[data-theme="dark"] .dbig{color:#f87171}

  /* ---- 帮助弹窗排版 ---- */
  .help h4{margin:16px 0 4px;font-size:.95em;color:var(--brand)}
  .help table{margin:2px 0 4px}
  .help td{padding:5px 8px;vertical-align:top}
  .help td:first-child{white-space:nowrap;width:1%;font-family:Consolas,"Cascadia Mono",monospace;
    color:var(--ink)}
  .help ul{margin:4px 0 4px 1.1em;padding:0}
  .help li{margin:3px 0}
  .esc{color:var(--dim);font-size:.86em;margin-top:14px}

  /* ---- 填空题（程序填空）---- */
  .codebox{font-family:Consolas,"Cascadia Mono","Courier New",monospace;font-size:.96em;
    line-height:2.1;background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;overflow-x:auto;white-space:pre;margin:0 0 12px}
  .codebox .ln{display:block}
  .blk{font-family:inherit;font-size:.95em;color:var(--ink);background:var(--panel);
    border:1px solid var(--brand);border-bottom-width:2px;border-radius:6px;
    padding:1px 6px;margin:0 2px;width:9.5em;min-width:5em}
  .blk:focus{outline:2px solid var(--brand);outline-offset:1px}
  .blk.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
  .blk.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .blk:disabled{opacity:.95;cursor:default}
  .blkno{color:var(--dim);font-size:.86em;margin-left:2px}
  .keybox{margin:2px 0 12px}
  .keybox table{font-size:.92em}
  .keybox .k{font-family:Consolas,monospace;color:var(--ok);white-space:pre-wrap}
  .keybox .k.bad{color:var(--bad)}
  .keybox .alt{color:var(--dim);font-size:.9em}
  .keybox .mine{color:var(--dim);font-size:.9em}
  .keybox .mine.half{color:var(--bad);font-weight:600}
  .blk.half{border-color:var(--bad);border-style:dashed}
  .warnline{color:var(--bad);font-size:.9em;margin:2px 0 8px}
  .papermeta{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 12px}
  .chip{border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:.86em;
    color:var(--dim)}
  .chip b{color:var(--ink)}

  /* ---- 程序改错题（第 3 问）----
     编辑器用「行号栏 + textarea」两栏，超长行横向滚动时行号仍然对齐；
     判题报告复用填空页的配色变量（--ok / --bad / --warn）。 */
  .fix-wrap{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;
    overflow:hidden;margin:0 0 10px;background:var(--bg)}
  .fix-gut{flex:0 0 auto;padding:8px 6px 8px 10px;text-align:right;color:var(--dim);
    font-family:Consolas,"Cascadia Mono","Courier New",monospace;font-size:.92em;
    line-height:1.5;background:var(--panel);user-select:none;border-right:1px solid var(--line);
    white-space:pre;overflow:hidden}
  /* 用户 m08149：不要编辑器自己的拖拽手柄；高度由「上面程序 / 下面输入输出」
     的分配决定，并限定最小高度（拖到再小也留 18em，约 12 行可见）。 */
  /* ⚠ 高度必须用 rem 不能用 em：这个元素的 font-size 是 .92em（= 14.72px），
     写 26em 得到的是 26 × 14.72 ≈ 383px，只够 17 行可见（实测），
     而最长的一题正文有 42 行 —— 这就是「编辑器看着变小了」的原因。
     1 行 = 14.72 × 1.5 ≈ 22.08px ⇒ 42rem ≈ 30 行可见。 */
  .fix-ta{flex:1 1 auto;border:0;outline:0;resize:none;background:transparent;
    color:var(--ink);padding:8px 10px;font-family:Consolas,"Cascadia Mono","Courier New",monospace;
    font-size:.92em;line-height:1.5;height:42rem;min-height:28rem;max-height:none;
    white-space:pre;overflow-wrap:normal;overflow:auto;tab-size:4}
  /* 洛谷式：动作按钮在编辑器**上方**（原来在 18 行编辑器下面，要滚到底才点得到）。
     用户 2026-10-14 提的方案：动作条置顶、下方保留可反复运行的能力。 */
  .fix-filebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;

  .fix-rep{font:inherit;font-size:.92em;line-height:1.6;white-space:normal;overflow-wrap:anywhere}

  .report-code{display:grid;grid-template-columns:1fr;gap:3px;margin:8px 0 0}

  .time-cell{white-space:nowrap;font-variant-numeric:tabular-nums}
  .fix-rep .ok{color:var(--ok)} .fix-rep .bad{color:var(--bad)} .fix-rep .warn{color:var(--mark)}
  html[data-theme="dark"] .fix-rep .warn{color:#fbbf24}
  .fix-rep .muted{color:var(--dim)}
  /* ---- 自测输入 / 输出（用户 2026-10-14 要求：像洛谷那样能自己喂输入看输出）---- */
  /* 自测区：洛谷式「左输入 / 右输出」 */
  .fix-io{margin-top:10px;border:1px solid var(--hair);border-radius:10px}
  /* 输入区：撑满所在面板、自己不留拖拽手柄，最小 8em（约 5 行） */
  .fix-io textarea{width:100%;box-sizing:border-box;border:0;
    background:transparent;color:var(--ink);font-family:Consolas,"Cascadia Mono","Courier New",monospace;
    font-size:.92em;line-height:1.5;padding:8px 10px;flex:1 1 auto;
    height:8em;min-height:6em;max-height:22em;resize:none;display:block;overflow:auto}
  .fix-io textarea:focus{outline:none}
  .fix-io .out{font-family:Consolas,"Cascadia Mono","Courier New",monospace;font-size:.92em;
    white-space:pre-wrap;word-break:break-all;padding:8px 10px;flex:1 1 auto;
    height:8em;min-height:6em;max-height:22em;overflow:auto;margin:0;color:var(--ink)}
  .fix-io .out .dim{color:var(--dim)}
  .fix-io .out .err{color:var(--bad)}
  .fix-io .step{color:var(--dim);font-size:.88em;margin-left:2px}
  /* 左右两栏：各自「标题条 + 内容」，标题条写清这是输入还是输出 */
  .fix-io .cols{display:grid;grid-template-columns:1fr 1fr}
  .fix-io .pane{display:flex;flex-direction:column;min-width:0}
  .fix-io .pane + .pane{border-left:1px solid var(--hair)}
  /* 「输入 / 输出」标题条：下边框用发丝线；与内容之间留一点缝（m08149 说贴得太紧） */
  .fix-io .ph{display:flex;align-items:center;gap:8px;padding:5px 10px;
    background:var(--bg);border-bottom:1px solid var(--hair);color:var(--dim);font-size:.88em}
  .fix-io .ph .sp{flex:1 1 auto}
  .fix-io .ph button{padding:1px 9px;font-size:.94em}
  .fix-io .pane textarea,.fix-io .pane .out{border:0;border-radius:0}
  @media (max-width:900px){.fix-io .cols{grid-template-columns:1fr}
    .fix-io .pane + .pane{border-left:0;border-top:1px solid var(--hair)}}
  /* 题干下方的「案例」：输入 / 输出 并排，照着自测用 */
  .fix-case{margin:2px 0 10px;border:1px solid var(--hair);border-radius:9px;overflow:hidden}
  .fix-case .ch{display:flex;align-items:center;gap:8px;padding:5px 10px;

  @media (max-width:900px){.fix-case .cb{grid-template-columns:1fr}
    .fix-case .cb > div + div{border-left:0;border-top:1px solid var(--hair)}}
  .week7{margin:12px 0 20px;padding:16px;background:var(--bg);border-radius:12px}

<script>
CQStorage.start(function(){
"use strict";


var BANK = JSON.parse(document.getElementById('bank-data').textContent);
var PAPERS = BANK.papers;
var PMAP = {}; PAPERS.forEach(function(p){ PMAP[p.id] = p; });
var TOTALQ = PAPERS.reduce(function(a,p){ return a + p.count; }, 0);


var BBANK = JSON.parse(document.getElementById('blank-data').textContent);
var BPAPERS = (BBANK && BBANK.papers) || [];
var BPMAP = {}; BPAPERS.forEach(function(p){ BPMAP[p.id] = p; });
var TOTALB = BPAPERS.reduce(function(a,p){ return a + p.count; }, 0);
var TOTALB_BLANK = BPAPERS.reduce(function(a,p){ return a + (p.blanks||0); }, 0);
var HAS_BLANK = TOTALB > 0;


var FBANK = JSON.parse(document.getElementById('fix-data').textContent);
var FPAPERS = (FBANK && FBANK.papers) || [];
var FIXQ = {};                       
var FXBY = {};                       
(FBANK.questions || []).forEach(function(q){
  
  if(q.num == null) q.num = q.no;
  FIXQ[q.paper + '#x' + q.num] = q;
  (FXBY[q.paper] = FXBY[q.paper] || []).push(q);
});
Object.keys(FXBY).forEach(function(pid){
  FXBY[pid].sort(function(a,b){ return a.num - b.num; });
});
var TOTALF = (FBANK.questions || []).length;
var HAS_FIX = TOTALF > 0;


var BUILD = 'dev';
var DATA_BUILD = 'dev';
var DATA_BUILD_KEY = 'cqframe.build.v1';
var GUIDE_SEEN_KEY = 'cqframe.guide.seen.v1';

function clearStoredUserData(){
  try{
    var keys = [];
    for(var i = 0; i < localStorage.length; i++){
      var key = localStorage.key(i);
      if(key && key.indexOf('cqframe.') === 0 && key !== GUIDE_SEEN_KEY) keys.push(key);
    }
    keys.forEach(function(key){ localStorage.removeItem(key); });
    localStorage.setItem(DATA_BUILD_KEY, DATA_BUILD);
    CQStorage.reset();
  }catch(e){}
}

try{
  if(DATA_BUILD !== 'dev' && localStorage.getItem(DATA_BUILD_KEY) !== DATA_BUILD)
    clearStoredUserData();
}catch(e){}


function footText(s){
  if(CQStorage.hasPending())s=s.replace('进度自动保存','存在未保存更改');
  var tag = (BUILD && BUILD !== 'dev') ? ('　·　构建 ' + BUILD) : '';
  return s + tag;
}

var LSKEY = {
  session:'cqframe.session.v1', review:'cqframe.review.v2', marks:'cqframe.marks.v1',
  pref:'cqframe.pref.v1', stats:'cqframe.stats.v1', wrongLegacy:'cqframe.wrong.v1',
  blanks:'cqframe.blanks.v1'
};


try{recoverPackTransaction();}catch(e){CQStorage.recovery(e,false);return;}
function load(k, dft){
  try{ var s = CQStorage.read(k); return s ? JSON.parse(s) : dft; }
  catch(e){ return dft; }
}
function save(k, v){
  return CQStorage.setRaw(k,JSON.stringify(v));
}
var SESSION = load(LSKEY.session, null);
var MARKS   = load(LSKEY.marks, {});      
var STATS   = load(LSKEY.stats, {log:{}});
var PREF    = load(LSKEY.pref, {theme:'light', fontSize:16, uiStyle:'classic', motion:true});
var LS_OK   = true;
try{ localStorage.setItem('cqframe.probe','1'); localStorage.removeItem('cqframe.probe'); }
catch(e){ LS_OK = false; }


var IVS = [1, 3, 7, 14, 30, 60];
var REC = load(LSKEY.review, null);
if(!REC){
  
  var old = load(LSKEY.wrongLegacy, {});
  REC = {};
  Object.keys(old || {}).forEach(function(k){
    var o = old[k] || {};
    REC[k] = { total:o.n||1, wrong:o.n||1, last:o.ts||Date.now(),
               stage:0, ivIdx:0, iv:0, due:o.ts||Date.now(), master:false };
  });
}
var WRONG = load(LSKEY.wrongLegacy, null);
var migratedSession = false;
if(!WRONG) WRONG = {};                    


function poolDue(now){
  now = now || Date.now();
  var out = [];
  Object.keys(REC).forEach(function(k){
    var r = REC[k];
    if(r.master) return;
    if(!packQuestionEnabled(k))return;
    if(!r.due || r.due <= now) out.push(k);
  });
  return out;
}
function poolActive(){        
  return Object.keys(REC).filter(function(k){ return !REC[k].master&&packQuestionEnabled(k); });
}
function poolMastered(){
  return Object.keys(REC).filter(function(k){ return !!REC[k].master&&packQuestionEnabled(k); });
}
function dueCount(now){ return poolDue(now).length; }


var AUTO_NEXT_TIMER=null,AUTO_NEXT_SEQ=0;
var DEF_SET = { needCorrect:2, dailyMax:20, flashSec:5, autoNext:0, autoNextSec:3 };
var SET = load('cqframe.set.v1', null) || {};
Object.keys(DEF_SET).forEach(function(k){ if(typeof SET[k] !== 'number') SET[k] = DEF_SET[k]; });
function normalizeAutoNext(){
  SET.autoNext=SET.autoNext===1?1:0;
  SET.autoNextSec=Number.isFinite(SET.autoNextSec)?Math.max(1,Math.min(60,Math.round(SET.autoNextSec))):DEF_SET.autoNextSec;
}
normalizeAutoNext();
function saveSet(){normalizeAutoNext();cancelAutoNext();save('cqframe.set.v1', SET);}
function cancelAutoNext(){
  AUTO_NEXT_SEQ++;
  if(AUTO_NEXT_TIMER!==null)clearTimeout(AUTO_NEXT_TIMER);
  AUTO_NEXT_TIMER=null;
}
function responseCorrect(o,s){
  var k=qid(o.pid,o.num);
  if(o.program){var pr=programVerdict(s,o);return !!pr&&pr.good;}
  if(o.blank){var q=findAny(o.pid,o.num);return !!q&&!!s.bsnap&&s.bsnap[k]===q.blankNums.length;}
  if(o.fix){var r=s.fix&&s.fix[fxid(o.pid,o.num)],qf=findF(o.pid,o.num);return !!r&&!!qf&&r.total>0&&r.fixed>=r.total&&r.score>=fixScoreOf(qf);}
  return !(s.reveal&&s.reveal[k])&&okOf(o.pid,o.num,s.picks[k]);
}
function queueAutoNext(o,correct,navToken){
  var s=SESSION,cur=s&&s.order[s.idx];
  if(!s||!cur||qid(cur.pid,cur.num)!==qid(o.pid,o.num)||
    (navToken!==undefined&&(s.jt||0)!==navToken))return;
  cancelAutoNext();
  if(!correct||SET.autoNext!==1||VIEW!=='practice'||s.done||isExam(s)||s.idx>=s.order.length-1||!responseCorrect(o,s))return;
  var idx=s.idx,jt=s.jt||0,seq=AUTO_NEXT_SEQ;
  AUTO_NEXT_TIMER=setTimeout(function(){
    if(seq!==AUTO_NEXT_SEQ)return;
    AUTO_NEXT_TIMER=null;
    if(SET.autoNext!==1||SESSION!==s||VIEW!=='practice'||s.done||isExam(s)||s.idx!==idx||
      (s.jt||0)!==jt||document.hidden||document.querySelector('.modal')||!responseCorrect(o,s))return;
    move(1);
  },SET.autoNextSec*1000);
}


function scheduleAfter(pid, num, good){
  var k = qid(pid,num), now = Date.now();
  var r = REC[k] || {total:0, wrong:0, last:0, stage:0, iv:0, due:0, master:false};
  r.total++;
  r.last = now;
  if(!good){
    r.wrong++;
    r.stage = 0;
    r.iv = 0;
    r.ivIdx = Math.max(0, (r.ivIdx || 0) - 1);   
    r.due = now;                                 
    r.master = false;
  }else{
    r.stage++;
    
    var idx = Math.min(Math.max(r.ivIdx || 0, 0), IVS.length-1);
    r.iv = IVS[idx];
    if(r.stage >= SET.needCorrect){
      r.master = true;
      r.due = (r.iv >= IVS[IVS.length-1]) ? 0 : now + r.iv*86400000;
    }else{
      r.master = false;
      r.due = now + r.iv*86400000;
    }
    r.ivIdx = Math.min(idx+1, IVS.length-1);
  }
  REC[k] = r;
  
  if(r.master){ delete WRONG[k]; }
  else { WRONG[k] = {n:r.wrong, ts:r.last}; }
  save(LSKEY.review, REC);
  save(LSKEY.wrongLegacy, WRONG);
  return r;
}
function resetOne(pid, num){
  delete REC[qid(pid,num)];
  save(LSKEY.review, REC);
  delete MARKS[qid(pid,num)];
  save(LSKEY.marks, MARKS);
}
function resetAllMastered(){
  var now = Date.now();
  poolMastered().forEach(function(k){
    var r = REC[k];
    r.master = false; r.stage = 0; r.iv = 0; r.ivIdx = 0; r.due = now;
  });
  save(LSKEY.review, REC);
}

var SNAP = 'none';
function snapOf(k){
  var r = REC[k];
  return r ? JSON.parse(JSON.stringify(r)) : SNAP;
}
function restoreSnap(k, snap){
  if(!snap) return;
  if(snap === SNAP){
    delete REC[k];
  }else{
    REC[k] = snap;
  }
  save(LSKEY.review, REC);
  WRONG = {};
  Object.keys(REC).forEach(function(kk){
    var r = REC[kk];
    if(!r.master) WRONG[kk] = {n:r.wrong, ts:r.last};
  });
  save(LSKEY.wrongLegacy, WRONG);
}
function dueLabel(r){
  if(r.master) return '已掌握';
  if(!r.stage) return '待复习';
  if(!r.due) return '长期计划';
  var d = Math.ceil((r.due - Date.now())/86400000);
  return d <= 0 ? '今天到期' : (d + ' 天后');
}


var IDMAP_RE = /^(\d{4})-([A-Za-z0-9\u4e00-\u9fa5-]+[A-Za-z])$/;
function migrateOldId(pid){
  var m = IDMAP_RE.exec(pid);
  if(!m) return null;
  var tail = m[2];
  if(/^[A-D]卷$/.test(tail)) return null;              
  var mm = /^([A-D])(?:卷|场)/.exec(tail);
  var letter = mm ? mm[1] : tail.slice(-1).toUpperCase();
  if(!/[A-D]/.test(letter)) return null;
  return m[1] + '-' + letter + '卷';
}
function migrateKey(k){

var FULLWIDTH_RE = /[\uFF01-\uFF5E\u3000“”‘’]/g;

function normalizeAns(s){
  s=String(s==null?'':s);
  var tokens=[],i=0;
  while(i<s.length){
    var rest=s.slice(i),m;
    if((m=/^[ \t\r\n\v\f]+/.exec(rest))){i+=m[0].length;continue;}
    if(rest.slice(0,2)==='//' || rest.slice(0,2)==='/*') return null;
    if((m=/^(?:u8|u|U|L)?["']/.exec(rest))){
      var start=i,quote=m[0].slice(-1),closed=false;
      i+=m[0].length;
      while(i<s.length){
        var c=s[i++];
        if(c==='\n'||c==='\r') return null;
        if(c==='\\'){
          if(i>=s.length||s[i]==='\n'||s[i]==='\r') return null;
          i++;
        }else if(c===quote){closed=true;break;}
      }
      if(!closed) return null;
      tokens.push(s.slice(start,i));continue;
    }
    m=/^[_A-Za-z][_A-Za-z0-9]*/.exec(rest) ||
      /^(?:[0-9]|\.[0-9])(?:[eEpP][+-]|[0-9A-Za-z_.])*/.exec(rest) ||
      /^(?:%:%:|>>=|<<=|\.\.\.|->|\+\+|--|<<|>>|<=|>=|==|!=|&&|\|\||\*=|\/=|%=|\+=|-=|&=|\^=|\|=|##|<:|:>|<%|%>|%:|[{}\[\]().&*+\-~!\/%<>=^|?:;,#])/.exec(rest);
    if(!m) return null;
    tokens.push(m[0]);i+=m[0].length;
  }
  return tokens.length?JSON.stringify(tokens):null;
}

function blankContext(q,n){
  var code=String(q.code||''),at=code.indexOf('___'+n+'___');
  if(at<0) return 'code';
  var state='code',prefix='';
  for(var i=0;i<at;i++){
    var c=code[i],next=code[i+1];
    if(state==='line'){if(c==='\n'){state='code';prefix='';}continue;}
    if(state==='comment'){
      if(c==='\n')prefix='';
      if(c==='*'&&next==='/'){state='code';i++;}
      continue;
    }
    if(state==='"'||state==="'"){
      if(c==='\\'){i++;continue;}
      if(c===state) state='code';
      continue;
    }
    if(state==='header'){if(c==='>')state='code';continue;}
    if(c==='\n'){prefix='';continue;}
    if(c==='/'&&next==='/'){state='line';i++;continue;}
    if(c==='/'&&next==='*'){state='comment';prefix+=' ';i++;continue;}
    if(c==='"'||c==="'"){state=c;prefix+=c;continue;}
    if(c==='<'&&/^[ \t]*#[ \t]*include[ \t]*$/.test(prefix))state='header';
    prefix+=c;
  }
  return state==='"'||state==="'"||state==='header'?'text':'code';
}

            : o.fix   ? fixScoreOf(findF(o.pid, o.num))
            : perOf(o.pid, o.num);
    full += per;
    if(o.program){var pr=programVerdict(report,o);if(!pr)un++;else if(pr.good){ok++;score+=pr.score||0;}else bad++;return;}
    if(o.blank){
      
      var q = findB(o.pid, parseInt(String(o.num).slice(1),10));
      if(!q) return;
      
      var bgot = (report.bsnap && report.bsnap[k] !== undefined) ? report.bsnap[k]
               : (!source && BLANKS && BLANKS.key === k && BLANKS.done ? BLANKS.res.filter(Boolean).length
                                                           : null);
      if(bgot === null){ un++; return; }
      if(bgot < 0){ bad++; return; }                 
      score += q.per * bgot;
      if(bgot >= q.blankNums.length) ok++; else bad++;
      return;
    }
    if(o.fix){
      
      var fr = report.fix && report.fix[fxid(o.pid, o.num)];
      if(!fr){ un++; return; }
      score += fr.score || 0;
      if((fr.score || 0) >= per) ok++; else bad++;
      return;
    }
    var pick = report.picks[k];
    if(!pick){if(report.reveal&&report.reveal[k])bad++;else un++;return;}
    if(okOf(o.pid,o.num,pick)){ ok++; score += per; } else bad++;
  });
  return {ok:ok, bad:bad, unanswered:un, total:report.order.length,
          score:score, full:full};
}

function fixTotal(pid){
  var fx = FXBY[pid];
  if(!fx) return 0;
  return fx.reduce(function(a,q){ return a + fixScoreOf(q); }, 0);

function fixPer(fq){
  if(!fq) return 0;
  if(fq.fixPer) return fq.fixPer;
  return fq.faults ? fq.faults.length * 10 : 0;   
}
function fixScoreOf(fq){
  if(!fq) return 0;

}

function paperPool(pid){
  var c = 0, b = 0, f = 0, m = 0;
  var p = PMAP[pid];
  if(p) p.questions.forEach(function(q){ var r = REC[qid(pid,q.num)]; if(r && !r.master){if(isMultipleQuestion(q))m++;else c++;} });
  var bp = BPMAP[pid];
  if(bp) bp.questions.forEach(function(q){ var r = REC[bqid(pid,q.num)]; if(r && !r.master) b++; });
  var fx = FXBY[pid];
  if(fx) fx.forEach(function(q){ var r = REC[fxid(pid,q.num)]; if(r && !r.master) f++; });
  var pc=programQuestions(pid).filter(function(q){var r=REC[qid(pid,'p'+q.num)];return r&&!r.master;}).length;
  var result={c:c,b:b,f:f,n:c+b+f+m+pc};if(pc)result.p=pc;if(m)result.m=m;return result;
}

function questionSeconds(o, source){

function flushTime(pause){
  if(!CLOCK) return;
  var now = Date.now(), st = CLOCK.session;
  if(isTimedExam(st)) now=Math.min(now,st.exam.deadline);
  if(CLOCK.since !== null){
    var delta = Math.max(0, now - CLOCK.since) / 1000;
    st.qtime = st.qtime || {};
    st.qtime[CLOCK.key] = (Number(st.qtime[CLOCK.key]) || 0) + delta;
    st.elapsed = (Number(st.elapsed) || 0) + delta;
  }
  CLOCK.since = pause ? null : now;
  if(st === SESSION) save(LSKEY.session, st);
}
function canTime(){
  return VIEW === 'practice' && SESSION && !SESSION.done && !document.hidden && !document.querySelector('.modal');
}
function updateTick(){
  if(!CLOCK || CLOCK.session !== SESSION) return;
  if(!canTime()){
    if(CLOCK.since !== null) flushTime(true);
  }else if(CLOCK.since === null){
    CLOCK.since = Date.now();
  }else{
    var now = Date.now();if(isTimedExam()) now=Math.min(now,SESSION.exam.deadline);
    var delta = Math.max(0, now - CLOCK.since) / 1000;
    SESSION.qtime[CLOCK.key] += delta;
    SESSION.elapsed = (Number(SESSION.elapsed) || 0) + delta;
    CLOCK.since = now;
    if(now - CLOCK.savedAt >= 5000){ save(LSKEY.session, SESSION); CLOCK.savedAt = now; }
  }
  if(TICK_EL) setPracticeTimer(TICK_EL,'本题',fmtTime(SESSION.qtime[CLOCK.key] || 0));
  if(TICK_TOTAL_EL) setPracticeTimer(TICK_TOTAL_EL,'本组',fmtTime(SESSION.elapsed || 0));
}
function startTick(node, totalNode){

  var o = SESSION.order[SESSION.idx], key = qid(o.pid,o.num);
  SESSION.qtime = SESSION.qtime || {};
  SESSION.qtime[key] = questionSeconds(o) || 0;
  CLOCK = {session:SESSION, key:key, since:canTime() ? Date.now() : null, savedAt:Date.now()};
  TICK_EL = node; TICK_TOTAL_EL = totalNode;
  updateTick();
  TICK = setInterval(function(){
    if(VIEW !== 'practice' || !SESSION){ stopTick(); return; }
    updateTick();
  }, 1000);
}
function stopTick(){
  flushTime(true);
  if(TICK){ clearInterval(TICK); TICK = null; }
  CLOCK = null; TICK_EL = TICK_TOTAL_EL = null;
}

  if(current&&!current.blank&&!current.fix&&isMultipleQuestion(findQ(current.pid,current.num))){toggleMultiple(L);return;}

    if(!examCanEdit()) return;
    var o=SESSION.order[SESSION.idx];if(o.blank || o.fix) return;
    SESSION.picks[qid(o.pid,o.num)]=L;save(LSKEY.session,SESSION);renderPractice();return;
  }
  var cur = SESSION.order[SESSION.idx];
  var k = qid(cur.pid, cur.num);
  if(SESSION.picks[k]) return;
  SESSION.snap = SESSION.snap || {};
  SESSION.snap[k] = snapOf(k);
  SESSION.picks[k] = L;

function modalBox(title, wide){
  cancelAutoNext();
  flushTime(true);
  var m = el('div','modal');
  m.style.cursor = 'default';
  m.style.zIndex = '100';
  var box = el('div','card');
  var previousFocus = document.activeElement;
  box.setAttribute('role', 'dialog');
  box.setAttribute('aria-modal', 'true');
  box.setAttribute('aria-label', title);
  box.tabIndex = -1;
  box.style.maxWidth = wide ? '560px' : '470px';
  box.style.width = '94vw';
  box.style.maxHeight = '88vh';
  box.style.overflowY = 'auto';
  box.style.cursor = 'default';
  box.appendChild(el('h2', null, title));
  m.appendChild(box);
  var remove = m.remove.bind(m);
  m.remove = function(){
    document.removeEventListener('keydown', modalKey);
    remove();
    updateTick();
    if(!document.querySelector('.modal') && previousFocus && previousFocus.isConnected && previousFocus.focus) previousFocus.focus();
  };
  function modalKey(ev){
    if(m.classList.contains('category-closing'))return;
    if(ev.key === 'Escape'){ ev.preventDefault();if(m.requestClose)m.requestClose();else m.remove();return; }
    if(ev.key !== 'Tab') return;
    var nodes = box.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex="0"]');
    nodes=Array.prototype.filter.call(nodes,function(n){return !n.getClientRects || n.getClientRects().length;});
    if(!nodes.length){ ev.preventDefault(); if(box.focus) box.focus(); return; }
    var first = nodes[0], last = nodes[nodes.length - 1];
    if(ev.shiftKey && (document.activeElement === first || document.activeElement === box)){
      ev.preventDefault(); last.focus();
    }else if(!ev.shiftKey && document.activeElement === last){
      ev.preventDefault(); first.focus();
    }
  }
  m.onclick = function(ev){ if(ev.target === m){if(m.requestClose)m.requestClose();else m.remove();} };
  document.addEventListener('keydown', modalKey);
  document.body.appendChild(m);
  if(box.focus) box.focus();
  return { m:m, box:box };
}

function applyPref(){
  if(!PREF || typeof PREF !== 'object' || Array.isArray(PREF)) PREF = {};
  PREF.theme = PREF.theme === 'dark' ? 'dark' : 'light';
  PREF.fontSize = Math.max(13,Math.min(22,Number(PREF.fontSize) || 16));
  PREF.uiStyle = PREF.uiStyle === 'nasa' ? 'nasa' : 'classic';
  PREF.motion = PREF.motion !== false;
  delete PREF.badgeMark;
  document.documentElement.setAttribute('data-theme', PREF.theme);
  document.documentElement.setAttribute('data-ui-style', PREF.uiStyle);
  document.documentElement.setAttribute('data-motion', PREF.motion ? 'on' : 'off');
  document.documentElement.setAttribute('data-classic-large',PREF.fontSize>=20?'true':'false');
  if(!PREF.motion)clearPickContentEntry();
  document.documentElement.style.setProperty('--font-size', PREF.fontSize + 'px');
  if(NASA_BADGE_SYNC) NASA_BADGE_SYNC();
}


document.addEventListener('keydown', function(e){
  if(VIEW !== 'practice' || !SESSION || !SESSION.order.length) return;
  if(e.ctrlKey || e.altKey || e.metaKey || e.isComposing || e.defaultPrevented) return;
  if(document.querySelector('.modal')) return;
  var tag = (e.target && e.target.tagName) || '';
  if(/^(INPUT|TEXTAREA|SELECT|BUTTON|A|SUMMARY)$/.test(tag) || (e.target && e.target.isContentEditable)) return;
  var cur = SESSION.order[SESSION.idx];
  if(!cur) return;
  var choice = !cur.program && !cur.blank && !cur.fix && !/^[bxp]/.test(String(cur.num));
  var k = qid(cur.pid, cur.num);
  var key = e.key;
  if(choice && /^[1-8]$/.test(key)){ var letter='ABCDEFGH'.charAt(parseInt(key,10)-1);if(QuestionPackSchema.optionKeys(findQ(cur.pid,cur.num)).indexOf(letter)>=0){choose(letter);e.preventDefault();} }
  else if(choice && /^[a-hA-H]$/.test(key)){ if(QuestionPackSchema.optionKeys(findQ(cur.pid,cur.num)).indexOf(key.toUpperCase())>=0){choose(key.toUpperCase());e.preventDefault();} }
  else if(key === 'ArrowRight' || key === 'Enter'){ move(1); e.preventDefault(); }
  else if(key === 'ArrowLeft'){ move(-1); e.preventDefault(); }
  else if(key === 'n' || key === 'N'){ jumpRandom(); e.preventDefault(); }
  else if(key === 's' || key === 'S'){
    if(isExam()){
      if(!examCanEdit())return;
      SESSION.exam.flags[k]=!SESSION.exam.flags[k];save(LSKEY.session,SESSION);renderPractice();e.preventDefault();return;
    }
    if(MARKS[k]) delete MARKS[k]; else MARKS[k] = true;
    save(LSKEY.marks, MARKS); renderPractice(); e.preventDefault();
  }
  else if(choice && !isExam() && (key === 'r' || key === 'R')){
    if(isMultipleQuestion(findQ(cur.pid,cur.num))){revealMultiple();e.preventDefault();return;}
    if(SESSION.picks[k] || SESSION.reveal[k]) return;
    if(!confirm('查看答案会把这题计为做错并加入复习池，确认？')) return;
    SESSION.reveal[k] = true;
    scheduleAfter(cur.pid, cur.num, false);
    bumpDaily();
    save(LSKEY.session, SESSION); renderPractice(); e.preventDefault();
  }
});
